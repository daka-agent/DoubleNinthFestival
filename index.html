<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登高 · 重阳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E5%B1%B1%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F7F3EC;
  --ink:#2C2C2A;
  --ink2:#6B665E;
  --ink3:#9A948A;
  --cinnabar:#B44A3C;
  --line:rgba(44,44,42,.14);
}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  line-height:1.75;
  overflow-x:hidden;
}

/* 层叠山景：越往上走，脚下的山沉得越快，露出更远的一层 */
#scene{position:fixed;left:0;right:0;bottom:0;height:56vh;z-index:0;pointer-events:none}
.mt{
  position:absolute;left:-6%;right:-6%;bottom:0;transform-origin:50% 100%;
  transform:translateY(0) scaleX(1);
  transition:transform 1.25s cubic-bezier(.22,.61,.36,1);
}
.mt svg{width:100%;height:100%;display:block}
.m1{height:34%;opacity:.13}
.m2{height:28%;bottom:21%;opacity:.09}
.m3{height:21%;bottom:40%;opacity:.062}
.m4{height:15%;bottom:55%;opacity:.042}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;z-index:1;padding:0 28px 40px}

/* 九折山径 */
#path{position:fixed;left:10px;top:50%;transform:translateY(-50%);width:44px;height:280px;z-index:5}
#path svg{width:100%;height:100%;display:block;overflow:visible}
#ptrack{fill:none;stroke:rgba(44,44,42,.13);stroke-width:1.8}
#pdone{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
#pdot{fill:var(--cinnabar);transition:cx .8s cubic-bezier(.22,.61,.36,1),cy .8s cubic-bezier(.22,.61,.36,1)}
#ptop{font-family:inherit;font-size:10px;fill:#9A948A;letter-spacing:.1em}
@media(max-width:600px){#path{display:none}}

/* 屏 */
.screen{display:none;min-height:100vh;flex-direction:column;justify-content:center}
.screen.on{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.screen.on>*{animation:rise .75s cubic-bezier(.22,.61,.36,1) both}
.screen.on>*:nth-child(2){animation-delay:.05s}
.screen.on>*:nth-child(3){animation-delay:.1s}
.screen.on>*:nth-child(4){animation-delay:.15s}
.screen.on>*:nth-child(5){animation-delay:.2s}
.screen.on>*:nth-child(6){animation-delay:.25s}

.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--ink3);margin-bottom:20px}
h1{font-size:38px;font-weight:500;letter-spacing:.1em;line-height:1.3;margin-bottom:22px}
.ridge{width:100%;height:32px;margin:0 0 26px;border-top:1.5px solid var(--ink);border-radius:50%/100% 100% 0 0;opacity:.18}
.lede{font-size:15px;color:var(--ink2);line-height:2.1;margin-bottom:40px}
.lede em{font-style:normal;color:var(--cinnabar)}

button.ghost{
  align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:14px;letter-spacing:.22em;padding:11px 26px;border-radius:2px;cursor:pointer;
  transition:.3s;
}
button.ghost:hover{border-color:var(--ink)}
button.ghost:active{background:var(--ink);color:var(--paper)}

/* 站点 */
.station-no{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;letter-spacing:.3em;color:var(--ink3);margin-bottom:26px}
.station-no i{width:16px;height:1px;background:var(--line)}
.figure{position:relative;width:190px;height:190px;margin:0 auto 16px}
.figure svg{width:100%;height:100%;display:block}
.figure::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-8px;height:var(--arc,21px);
  border-top:1.5px solid var(--ink);border-radius:50%/100% 100% 0 0;opacity:.16;pointer-events:none;
  transition:height 1.2s cubic-bezier(.22,.61,.36,1)}
.figcap{text-align:center;font-size:11.5px;letter-spacing:.14em;color:var(--ink3);margin-bottom:30px}
.line{font-size:23px;line-height:1.85;font-weight:500;margin-bottom:14px;letter-spacing:.03em}
.line2{font-size:14px;color:var(--ink2);line-height:1.9;margin-bottom:18px;padding-left:14px;border-left:2px solid var(--line)}
.from{font-size:12px;letter-spacing:.18em;color:var(--ink3);margin-bottom:30px}

.know{border-top:1px solid var(--line);padding:18px 0 26px}
.know summary{
  list-style:none;cursor:pointer;font-size:13px;letter-spacing:.2em;color:var(--ink2);
  display:flex;align-items:center;gap:8px;
}
.know summary::-webkit-details-marker{display:none}
.know summary::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);transition:.3s}
.know[open] summary::before{background:var(--cinnabar)}
.know p{font-size:13.5px;color:var(--ink2);line-height:2;margin-top:14px;animation:rise .5s ease}

.nav{display:flex;gap:12px;margin-top:26px}
.nav button{flex:1;background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;
  font-size:13px;letter-spacing:.2em;padding:12px 0;border-radius:2px;cursor:pointer;transition:.3s}
.nav button:hover{border-color:var(--ink)}
.nav button:disabled{opacity:.28;cursor:default}

/* 山顶 */
.top-line{font-size:20px;line-height:2;margin-bottom:26px}
.call{margin-top:34px;border:1px solid var(--ink);border-radius:2px;padding:22px}
.call p{font-size:14px;line-height:2;color:var(--ink2)}
.call strong{color:var(--ink);font-weight:500}
.tel{margin-top:16px;font-size:13px;color:var(--ink2);line-height:2}
.tel span{display:block;padding:5px 0;border-bottom:1px dashed var(--line)}
</style>
</head>

let cur = -1;
const app = document.getElementById('app');
const mts = [
  document.querySelector('.m1'),
  document.querySelector('.m2'),
  document.querySelector('.m3'),
  document.querySelector('.m4')
];
/* 由近到远：脚下的沉得快，远处的不动，于是越往上看见的层数越多 */
const SINK = [300, 158, 84, 30];
const FLAT = [.20, .15, .10, .05];
const pDone = document.getElementById('pdone');
const pDot = document.getElementById('pdot');
let pLen = 0;
try { pLen = pDone.getTotalLength(); } catch (e) { pLen = 0; }

function cover(){
  app.innerHTML = `
  <section class="screen on">
    <p class="eyebrow">农历九月初九 · 重阳</p>
    <h1>登高</h1>
    <div class="ridge"></div>
    <p class="lede">九月初九，两九相重，故曰重阳。<br>
    古人在这一天登高、插茱萸、饮菊花酒，<br>
    后来这一天成了<em>老人节</em>。<br><br>
    除夕、清明、中元、重阳，是中国的四大祭祖节。<br>
    前三个敬的都是先人，<br>
    只有重阳，敬的是<em>还活着的人</em>。<br><br>
    今天走一趟<em>九折山路</em>。<br>
    路上有十个老人，你从小就认得他们。</p>
    <button class="ghost" onclick="go(0)">往上走</button>
  </section>`;
}

function station(i){
  const s = STATIONS[i];
  app.innerHTML = `
  <section class="screen on">
    <p class="station-no"><span>${s.no}</span><i></i><span>${s.alt}</span></p>
    <div class="figure">${FIG[i]}</div>
    <p class="figcap">${s.obj}</p>
    <p class="line">${s.line}</p>
    ${s.line2?`<p class="line2">${s.line2}</p>`:''}
    <p class="from">${s.from} · ${s.name}</p>
    <details class="know">
      <summary>知道了</summary>
      <p>${s.know}</p>
    </details>
    <div class="nav">
      <button onclick="go(${i-1})" ${i===0?'disabled':''}>往下</button>
      <button onclick="go(${i+1})">${i===STATIONS.length-1?'到山顶':'往上'}</button>
    </div>
  </section>`;
}

function summit(){
  app.innerHTML = `
  <section class="screen on">
    <p class="eyebrow">山顶</p>
    <h1>趁他还在</h1>
    <div class="ridge"></div>
    <p class="top-line">十个老人，十句话。<br>
    他们要的都不是同情，<br>
    是<em>你认得他，你记得他</em>。</p>
    <div class="call">
      <p><strong>重阳节，给家里老人打个电话。</strong><br>
      不用说什么大事。问一句就好：</p>
      <div class="tel">
        <span>「您小时候，家门口有什么？」</span>
        <span>「您这辈子最得意的一件事是什么？」</span>
        <span>「有没有一个人，您一直想谢谢他？」</span>
      </div>
      <p style="margin-top:16px">打得完的电话，别等到来不及。</p>
    </div>
    <div class="nav">
      <button onclick="go(9)">往下</button>
      <button onclick="cover()">从头走</button>
    </div>
  </section>`;
}

function go(i){
  if(i < 0){ cover(); setPath(-1); return; }
  if(i >= STATIONS.length){ cur = STATIONS.length-1; summit(); setPath(STATIONS.length); return; }
  cur = i;
  station(i);
  setPath(i+1);
}

function setPath(step){
  const total = STATIONS.length;
  const pct = Math.max(0, Math.min(1, step/total));
  if(pLen > 0){
    pDone.style.strokeDasharray = pLen;
    pDone.style.strokeDashoffset = pLen * (1 - pct);
    try {
      const pt = pDone.getPointAtLength(pLen * pct);
      pDot.setAttribute('cx', pt.x.toFixed(2));
      pDot.setAttribute('cy', pt.y.toFixed(2));
    } catch (e) {}
  }
  /* 人往上走：脚下的山沉下去，远处的山留下来，视野一层层打开 */
  for(let k = 0; k < mts.length; k++){
    if(!mts[k]) continue;
    mts[k].style.transform =
      'translateY(' + (pct * SINK[k]).toFixed(1) + 'px) scaleX(' + (1 + pct * FLAT[k]).toFixed(3) + ')';
  }
  /* 脚下的山脊，越往上越平缓 */
  document.documentElement.style.setProperty('--arc', (21 - pct * 10).toFixed(1) + 'px');
}

/* 滑动翻页 */
let sy = 0;
document.addEventListener('touchstart', e => sy = e.touches[0].clientY, {passive:true});
document.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dy) < 60) return;
  if(dy < 0) go(cur + 1); else go(cur - 1);
}, {passive:true});
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp' || e.key === 'ArrowRight') go(cur + 1);
  if(e.key === 'ArrowDown' || e.key === 'ArrowLeft') go(cur - 1);
});

cover();
setPath(0);
</script>
