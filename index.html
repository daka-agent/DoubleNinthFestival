<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登高 · 重阳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E5%B1%B1%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F7F3EC;
  --ink:#2C2C2A;
  --ink2:#6B665E;
  --ink3:#9A948A;
  --cinnabar:#B44A3C;
  --line:rgba(44,44,42,.14);
}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  line-height:1.75;
  overflow-x:hidden;
}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding:0 28px 40px}

/* 山路进度 */
#path{position:fixed;left:18px;top:50%;transform:translateY(-50%);height:220px;width:2px;background:var(--line);z-index:5}
#path i{position:absolute;left:0;bottom:0;width:2px;background:var(--ink);height:0;transition:height .6s ease}
#path b{position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);bottom:0;transition:bottom .6s ease}
@media(max-width:560px){#path{display:none}}

/* 屏 */
.screen{display:none;min-height:100vh;flex-direction:column;justify-content:center;animation:in .7s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--ink3);margin-bottom:20px}
h1{font-size:38px;font-weight:500;letter-spacing:.1em;line-height:1.3;margin-bottom:22px}
.lede{font-size:15px;color:var(--ink2);line-height:2.1;margin-bottom:40px}
.lede em{font-style:normal;color:var(--cinnabar)}

button.ghost{
  align-self:flex-start;background:none;border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:14px;letter-spacing:.22em;padding:11px 26px;border-radius:2px;cursor:pointer;
  transition:.3s;
}
button.ghost:hover{border-color:var(--ink)}
button.ghost:active{background:var(--ink);color:var(--paper)}

/* 站点 */
.station-no{font-size:12px;letter-spacing:.3em;color:var(--ink3);margin-bottom:26px}
.figure{width:190px;height:190px;margin:0 auto 30px;display:block}
.figure svg{width:100%;height:100%;display:block}
.line{font-size:23px;line-height:1.85;font-weight:500;margin-bottom:14px;letter-spacing:.03em}
.line2{font-size:14px;color:var(--ink2);line-height:1.9;margin-bottom:18px;padding-left:14px;border-left:2px solid var(--line)}
.from{font-size:12px;letter-spacing:.18em;color:var(--ink3);margin-bottom:30px}

.know{
  border-top:1px solid var(--line);padding:18px 0 26px;
}
.know summary{
  list-style:none;cursor:pointer;font-size:13px;letter-spacing:.2em;color:var(--ink2);
  display:flex;align-items:center;gap:8px;
}
.know summary::-webkit-details-marker{display:none}
.know summary::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);transition:.3s}
.know[open] summary::before{background:var(--cinnabar)}
.know p{font-size:13.5px;color:var(--ink2);line-height:2;margin-top:14px;animation:in .5s ease}

.nav{display:flex;gap:12px;margin-top:26px}
.nav button{flex:1;background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;
  font-size:13px;letter-spacing:.2em;padding:12px 0;border-radius:2px;cursor:pointer;transition:.3s}
.nav button:hover{border-color:var(--ink)}
.nav button:disabled{opacity:.28;cursor:default}

/* 山顶 */
.top-line{font-size:20px;line-height:2;margin-bottom:26px}
.call{
  margin-top:34px;border:1px solid var(--ink);border-radius:2px;padding:22px;
}
.call p{font-size:14px;line-height:2;color:var(--ink2)}
.call strong{color:var(--ink);font-weight:500}
.tel{margin-top:16px;font-size:13px;color:var(--ink2);line-height:2}
.tel span{display:block;padding:5px 0;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>

<div id="path"><i></i><b></b></div>
<div id="app"></div>

<script>

    line:"发挥余热",
    line2:"",
    know:"他原名贾敬贤，1945 年参加革命，离休前是个副局长。退下来那天，局里把他的办公桌挪到了妇联那屋，他回家念叨：要不然，我再到计划生育那去忍忍。<br>演他的文兴宇那年 52 岁，为了像，用白漆把头发染白，染到后来真的白了头。《我爱我家》第一集的名字，就叫《发挥余热》。"

    line2:"",
    know:"小丸子的爷爷，76 岁，溺爱孙女，什么事都站在她一边。口袋里常揣一张写着地址的卡片，怕自己走丢。<br>他爱写「友藏心之俳句」，这一句是最软的一首——一个已经开始忘事的人，最怕的是被别人忘记。"

    line2:"",
    know:"汤屋锅炉房的主管，驼背，有六条能随意伸缩的手臂，一天到晚在干活。<br>千寻来找工做，他嘴上说人手够了，转头却对小玲说：是我的小孙女。<br>片尾他掏出一张珍藏了四十年的车票，给了一个要去远方的孩子。"

    line2:"",
    know:"荣耀国的老狒狒巫师。辛巴以为是自己害死了父亲，逃走再也不敢回头。<br>拉飞奇一木杖敲醒他：过去是过去，怎么对待它，是你自己选的。<br>原句：Oh yes, the past can hurt. But the way I see it, you can either run from it, or learn from it."
  },
  {
    no:"第六站", name:"乌龟大师", from:"《功夫熊猫》",
    line:"昨天是历史，<br>明天是谜团，今天是礼物。",
    line2:"",
    know:"原句：Yesterday is history, tomorrow is a mystery, but today is a gift. That is why it is called the present.<br>他走的那天，留下的最后一句是：You must believe.（你要相信。）"

    line2:"",
    know:"木兰的父亲，年迈仍在征兵之列，木兰代他从军。<br>这句是她回来那一天他说的。原句：The greatest gift and honor is having you for a daughter."

    line2:"只要上了我的船，再怎么样的笨蛋也是我的孩子。",
    know:"这是他最后的船长命令。他站着死去，全身刀伤 267 处、子弹 152 发、炮弹 46 枚，背后一处都没有——他说过，这是一个男人的骄傲。<br>船员都叫他「老爹」。他们多半是被世界扔掉的人，是他先认下了他们。他不要财宝，他想要的从来就只是一个家。"
  },
  {
    no:"第九站", name:"卡尔", from:"《飞屋环游记》",
    line:"它只是座房子。",
    line2:"",
    know:"艾莉先走了。她在冒险手册的最后一页写：谢谢你陪我走过这一程，去展开下一段属于你的冒险吧。<br>很多年后，卡尔把挂满气球的房子放走的时候，说了这句。房子没了又怎样——他们一起走完的这一生，才是那场冒险。"
  },
  {
    no:"山顶", name:"可可", from:"《寻梦环游记》",
    line:"真正的死亡，<br>是世界上再没有一个人记得你。",
    line2:"",
    know:"原句：The real death is that no one in the world remembers you.<br>除夕、清明、中元、重阳，是中国四大祭祖节。前三个敬的都是先人，只有重阳敬的是还活着的人。<br>所以趁他还在——记得他。"

const CN = ["","一","二","三","四","五","六","七","八","九","十"];

<path d="M100 134 L100 174" />
<path d="M82 174 L118 174" />
</svg>`
];

let cur = -1;
const app = document.getElementById('app');

function cover(){
  app.innerHTML = `
  <section class="screen on">
    <p class="eyebrow">农历九月初九 · 重阳</p>
    <h1>登高</h1>
    <p class="lede">九月初九，两九相重，故曰重阳。<br>
    古人在这一天登高、插茱萸、饮菊花酒，<br>
    后来这一天成了<em>老人节</em>。<br><br>
    除夕、清明、中元、重阳，是中国的四大祭祖节。<br>
    前三个敬的都是先人，<br>
    只有重阳，敬的是<em>还活着的人</em>。</p>
    <button class="ghost" onclick="go(0)">往上走</button>
  </section>`;
}

function station(i){
  const s = STATIONS[i];
  app.innerHTML = `
  <section class="screen on">
    <p class="station-no">${s.no} · 共十站</p>
    <div class="figure">${FIG[i]}</div>
    <p class="line">${s.line}</p>
    ${s.line2?`<p class="line2">${s.line2}</p>`:''}
    <p class="from">${s.from} · ${s.name}</p>
    <details class="know">
      <summary>知道了</summary>
      <p>${s.know}</p>
    </details>
    <div class="nav">
      <button onclick="go(${i-1})" ${i===0?'disabled':''}>往下</button>
      <button onclick="go(${i+1})">${i===STATIONS.length-1?'登顶':'往上'}</button>
    </div>
  </section>`;
}

function summit(){
  app.innerHTML = `
  <section class="screen on">
    <p class="eyebrow">山顶</p>
    <h1>趁他还在</h1>
    <p class="top-line">十个老人，十句话。<br>
    他们要的都不是同情，<br>
    是<em>你认得他，你记得他</em>。</p>
    <div class="call">
      <p><strong>今天，给家里打个电话。</strong><br>
      不用说什么大事。问一句就好：</p>
      <div class="tel">
        <span>「您小时候，家门口有什么？」</span>
        <span>「您这辈子最得意的一件事是什么？」</span>
        <span>「有没有一个人，您一直想谢谢他？」</span>
      </div>
      <p style="margin-top:16px">打得完的电话，别等到来不及。</p>
    </div>
    <div class="nav">
      <button onclick="go(9)">往下</button>
      <button onclick="cover()">从头走</button>
    </div>
  </section>`;
}

function go(i){
  if(i < 0){ cover(); setPath(-1); return; }
  if(i >= STATIONS.length){ cur = STATIONS.length-1; summit(); setPath(STATIONS.length); return; }
  cur = i;
  station(i);
  setPath(i+1);
}

function setPath(step){
  const total = STATIONS.length;
  const pct = Math.max(0, Math.min(1, step/total)) * 100;
  document.querySelector('#path i').style.height = pct + '%';
  document.querySelector('#path b').style.bottom = pct + '%';
}

/* 滑动翻页 */
let sy = 0;
document.addEventListener('touchstart', e => sy = e.touches[0].clientY, {passive:true});
document.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dy) < 60) return;
  if(dy < 0) go(cur + 1); else go(cur - 1);
}, {passive:true});
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp' || e.key === 'ArrowRight') go(cur + 1);
  if(e.key === 'ArrowDown' || e.key === 'ArrowLeft') go(cur - 1);
});

cover();
setPath(0);
</script>
